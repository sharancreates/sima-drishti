<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BorderVision - AI Tactical Perimeter Defense</title>
    <!-- Tailwind CSS CDN with Offline Resilience Fallback -->
    <script src="https://cdn.tailwindcss.com" onerror="console.warn('[BorderVision] Tailwind CDN unreachable (Air-Gapped / Offline). Activating local tactical styling system.'); window.tailwindOffline = true;"></script>
    <!-- Google Fonts with Local System Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      if (window.tailwind) {
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                tacticalNavy: '#0B1120',
                tacticalBlue: '#3B82F6',
                tacticalSlate: '#1E293B',
                tacticalBorder: '#1e3a5f',
                tactical: {
                  bg: '#0F172A',
                  card: '#1E293B',
                  border: '#334155',
                  accent: '#3B82F6',
                  alert: '#EF4444',
                  warning: '#F59E0B',
                  safe: '#10B981',
                  muted: '#64748B'
                }
              },
              fontFamily: {
                mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                sans: ['Inter', 'system-ui', 'sans-serif']
              }
            }
          }
        };
      }
    </script>
    <style>
      @keyframes sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.65); opacity: 0.8; }
        50% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      .radar-sweep {
        animation: sweep 3s linear infinite;
        transform-origin: center center;
      }
      .pulse-ring-1 {
        animation: pulse-ring 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-ring-2 {
        animation: pulse-ring 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) 0.9s infinite;
      }
      .pulse-ring-3 {
        animation: pulse-ring 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) 1.8s infinite;
      }
      .bg-grid-tactical {
        background-size: 36px 36px;
        background-image: 
          linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      }
      .tripwire-line {
        background: linear-gradient(90deg, rgba(239, 68, 68, 0.2) 0%, rgba(239, 68, 68, 0.85) 50%, rgba(239, 68, 68, 0.2) 100%);
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 2px rgba(255, 255, 255, 0.8);
      }
      .bbox-person {
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5), inset 0 0 8px rgba(239, 68, 68, 0.2);
      }
      .bbox-vehicle {
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5), inset 0 0 8px rgba(59, 130, 246, 0.2);
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body class="bg-[#0B1120] text-slate-100 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
